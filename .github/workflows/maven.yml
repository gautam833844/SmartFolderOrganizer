name: Java CI with Maven

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21 (Temurin)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Compile Project
      run: mvn clean compile -B

    - name: Run Unit Tests
      run: mvn test -B

    - name: Generate JaCoCo Coverage Report
      run: mvn jacoco:report -B

    - name: Run SpotBugs Static Analysis
      run: mvn spotbugs:check -B || true

    - name: Run PMD Code Analysis
      run: mvn pmd:check -B || true

    - name: Run Checkstyle Verification
      run: mvn checkstyle:check -B || true

    - name: Package Application (Fat JAR)
      run: mvn package -DskipTests -B

    - name: Upload JaCoCo Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-coverage-report
        path: target/site/jacoco/
        if-no-files-found: ignore

    - name: Upload Surefire Test Reports
      uses: actions/upload-artifact@v4
      with:
        name: surefire-test-reports
        path: target/surefire-reports/
        if-no-files-found: ignore

    - name: Upload Packaged Fat JAR
      uses: actions/upload-artifact@v4
      with:
        name: SmartFolderOrganizer-Executable-JAR
        path: target/SmartFolderOrganizer-1.0.0-SNAPSHOT.jar
        if-no-files-found: ignore
